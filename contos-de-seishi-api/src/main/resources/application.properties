# ===== Servidor =====
server.port=8081

# ===== Conexao com o MySQL =====
# Credenciais via variaveis de ambiente (DB_USERNAME / DB_PASSWORD).
# Em desenvolvimento local, preencha os valores apos os dois-pontos.
spring.datasource.url=jdbc:mysql://localhost:3306/contos_de_seishi?useTimezone=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Segredo com NO MINIMO 32 caracteres. Em producao, use variavel de ambiente JWT_SECRET.
app.jwt.secret=${JWT_SECRET:a3f8k2m9x7p1q4r6s8t0v2w5y8z1b3n6c9d2e5f7h9j2k4m6p8r1t3w5y7z}
app.jwt.expiracao-ms=86400000

# ===== Codificacao =====
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
